<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#04070f" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00F0FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="1092" height="372" rx="28" fill="url(#aboutBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Connecting Laser Synapse Network Line -->
  <path d="M 115 190 Q 200 90, 290 145 T 480 225 T 670 140 T 855 210 T 995 130" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6" />
  <path d="M 115 190 Q 200 90, 290 145 T 480 225 T 670 140 T 855 210 T 995 130" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="30 140" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-340" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- 1. CSE Data Science Node -->
  <g transform="translate(0, 0)">
    <g>
      <!-- Shadow & Outer Glow Ring -->
      <circle cx="115" cy="195" r="76" fill="#0f172a" stroke="#00F0FF" stroke-width="2.5" filter="url(#neonGlow)" />
      <circle cx="115" cy="195" r="82" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 115 195" to="360 115 195" dur="16s" repeatCount="indefinite" />
      </circle>
      <!-- Orbiting Particle -->
      <circle cx="115" cy="113" r="5" fill="#00F0FF" filter="url(#neonGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 115 195" to="360 115 195" dur="8s" repeatCount="indefinite" />
      </circle>
      <!-- Texts -->
      <text x="115" y="185" text-anchor="middle" class="font-sans" font-size="17" font-weight="800" fill="#ffffff">CSE</text>
      <text x="115" y="206" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#38BDF8">Data Science</text>
      <text x="115" y="224" text-anchor="middle" class="font-mono" font-size="10.5" fill="#94A3B8">3rd Year • 8.04</text>
      <!-- Floating Bob Animation -->
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="4.4s" begin="-0.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 2. Blind Coding Winner -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="295" cy="145" r="80" fill="#0f172a" stroke="#A855F7" stroke-width="2.5" filter="url(#neonGlow)" />
      <circle cx="295" cy="145" r="87" fill="none" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="360 295 145" to="0 295 145" dur="20s" repeatCount="indefinite" />
      </circle>
      <circle cx="295" cy="58" r="5" fill="#C084FC" filter="url(#neonGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 295 145" to="-360 295 145" dur="10s" repeatCount="indefinite" />
      </circle>
      <text x="295" y="135" text-anchor="middle" class="font-sans" font-size="15.5" font-weight="800" fill="#ffffff">Blind Coding</text>
      <text x="295" y="156" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#C084FC">Prize Winner</text>
      <text x="295" y="174" text-anchor="middle" class="font-mono" font-size="10.5" fill="#94A3B8">Inter-College</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="5.0s" begin="-1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 3. Campus Ambassador (GeeksforGeeks) -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="480" cy="225" r="84" fill="#0f172a" stroke="#10B981" stroke-width="2.5" filter="url(#neonGlow)" />
      <circle cx="480" cy="225" r="91" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 480 225" to="360 480 225" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle cx="480" cy="134" r="5" fill="#34D399" filter="url(#neonGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 480 225" to="360 480 225" dur="12s" repeatCount="indefinite" />
      </circle>
      <text x="480" y="215" text-anchor="middle" class="font-sans" font-size="15" font-weight="800" fill="#ffffff">Ambassador</text>
      <text x="480" y="236" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#34D399">GeeksforGeeks</text>
      <text x="480" y="254" text-anchor="middle" class="font-mono" font-size="10.5" fill="#94A3B8">Coding Mentor</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="5.6s" begin="-2.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 4. Founder (MYU Web Works) -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="670" cy="140" r="76" fill="#0f172a" stroke="#38BDF8" stroke-width="2.5" filter="url(#neonGlow)" />
      <circle cx="670" cy="140" r="83" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="360 670 140" to="0 670 140" dur="18s" repeatCount="indefinite" />
      </circle>
      <circle cx="670" cy="57" r="5" fill="#60A5FA" filter="url(#neonGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 670 140" to="-360 670 140" dur="9s" repeatCount="indefinite" />
      </circle>
      <text x="670" y="130" text-anchor="middle" class="font-sans" font-size="16" font-weight="800" fill="#ffffff">Founder</text>
      <text x="670" y="151" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#60A5FA">MYU Web Works</text>
      <text x="670" y="169" text-anchor="middle" class="font-mono" font-size="10.5" fill="#94A3B8">Web Architect</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6.2s" begin="-3.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 5. Hackathons (SIH 2025, 2026) -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="855" cy="215" r="78" fill="#0f172a" stroke="#F59E0B" stroke-width="2.5" filter="url(#neonGlow)" />
      <circle cx="855" cy="215" r="85" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 855 215" to="360 855 215" dur="20s" repeatCount="indefinite" />
      </circle>
      <circle cx="855" cy="130" r="5" fill="#FBBF24" filter="url(#neonGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 855 215" to="360 855 215" dur="10s" repeatCount="indefinite" />
      </circle>
      <text x="855" y="205" text-anchor="middle" class="font-sans" font-size="15" font-weight="800" fill="#ffffff">Hackathons</text>
      <text x="855" y="226" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#FBBF24">SIH 2025, 2026</text>
      <text x="855" y="244" text-anchor="middle" class="font-mono" font-size="10.5" fill="#94A3B8">Blind Coding 1st</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6.8s" begin="-4.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 6. AWS Cloud Intern -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="995" cy="130" r="62" fill="#0f172a" stroke="#FF9900" stroke-width="2.5" filter="url(#neonGlow)" />
      <circle cx="995" cy="130" r="68" fill="none" stroke="#FB923C" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="360 995 130" to="0 995 130" dur="14s" repeatCount="indefinite" />
      </circle>
      <circle cx="995" cy="62" r="4.5" fill="#FF9900" filter="url(#neonGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 995 130" to="-360 995 130" dur="7s" repeatCount="indefinite" />
      </circle>
      <text x="995" y="122" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="800" fill="#ffffff">AWS Intern</text>
      <text x="995" y="141" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#FB923C">Cloud Arch</text>
      <text x="995" y="157" text-anchor="middle" class="font-mono" font-size="9.5" fill="#94A3B8">AICTE</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="7.4s" begin="-5.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- Floating Sparkles -->
  <circle cx="210" cy="270" r="2.5" fill="#00F0FF" opacity="0.6">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="580" cy="80" r="3" fill="#A855F7" opacity="0.7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="760" cy="300" r="2" fill="#34D399" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
  </circle>
</svg>