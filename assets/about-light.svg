<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <defs>
    <linearGradient id="aboutBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="1092" height="372" rx="28" fill="url(#aboutBgLight)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Connecting Synapse Network Line -->
  <path d="M 115 190 Q 200 90, 290 145 T 480 225 T 670 140 T 855 210 T 995 130" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="6 6" />
  <path d="M 115 190 Q 200 90, 290 145 T 480 225 T 670 140 T 855 210 T 995 130" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="30 140" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-340" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- 1. CSE Data Science Node -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="115" cy="195" r="76" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" filter="url(#lightShadow)" />
      <circle cx="115" cy="195" r="82" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 115 195" to="360 115 195" dur="16s" repeatCount="indefinite" />
      </circle>
      <circle cx="115" cy="113" r="5" fill="#0284C7">
        <animateTransform attributeName="transform" type="rotate" from="0 115 195" to="360 115 195" dur="8s" repeatCount="indefinite" />
      </circle>
      <text x="115" y="185" text-anchor="middle" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">CSE</text>
      <text x="115" y="206" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#0284C7">Data Science</text>
      <text x="115" y="224" text-anchor="middle" class="font-mono" font-size="10.5" fill="#64748B">3rd Year • 8.04</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="4.4s" begin="-0.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 2. Blind Coding Winner -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="295" cy="145" r="80" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" filter="url(#lightShadow)" />
      <circle cx="295" cy="145" r="87" fill="none" stroke="#A855F7" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360 295 145" to="0 295 145" dur="20s" repeatCount="indefinite" />
      </circle>
      <circle cx="295" cy="58" r="5" fill="#7C3AED">
        <animateTransform attributeName="transform" type="rotate" from="0 295 145" to="-360 295 145" dur="10s" repeatCount="indefinite" />
      </circle>
      <text x="295" y="135" text-anchor="middle" class="font-sans" font-size="15.5" font-weight="800" fill="#0F172A">Blind Coding</text>
      <text x="295" y="156" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#7C3AED">Prize Winner</text>
      <text x="295" y="174" text-anchor="middle" class="font-mono" font-size="10.5" fill="#64748B">Inter-College</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="5.0s" begin="-1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 3. Campus Ambassador (GeeksforGeeks) -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="480" cy="225" r="84" fill="#FFFFFF" stroke="#059669" stroke-width="2.5" filter="url(#lightShadow)" />
      <circle cx="480" cy="225" r="91" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 480 225" to="360 480 225" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle cx="480" cy="134" r="5" fill="#059669">
        <animateTransform attributeName="transform" type="rotate" from="0 480 225" to="360 480 225" dur="12s" repeatCount="indefinite" />
      </circle>
      <text x="480" y="215" text-anchor="middle" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Ambassador</text>
      <text x="480" y="236" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#059669">GeeksforGeeks</text>
      <text x="480" y="254" text-anchor="middle" class="font-mono" font-size="10.5" fill="#64748B">Coding Mentor</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="5.6s" begin="-2.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 4. Founder (MYU Web Works) -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="670" cy="140" r="76" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" filter="url(#lightShadow)" />
      <circle cx="670" cy="140" r="83" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360 670 140" to="0 670 140" dur="18s" repeatCount="indefinite" />
      </circle>
      <circle cx="670" cy="57" r="5" fill="#2563EB">
        <animateTransform attributeName="transform" type="rotate" from="0 670 140" to="-360 670 140" dur="9s" repeatCount="indefinite" />
      </circle>
      <text x="670" y="130" text-anchor="middle" class="font-sans" font-size="16" font-weight="800" fill="#0F172A">Founder</text>
      <text x="670" y="151" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#2563EB">MYU Web Works</text>
      <text x="670" y="169" text-anchor="middle" class="font-mono" font-size="10.5" fill="#64748B">Web Architect</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6.2s" begin="-3.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 5. Hackathons (SIH 2025, 2026) -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="855" cy="215" r="78" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" filter="url(#lightShadow)" />
      <circle cx="855" cy="215" r="85" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 855 215" to="360 855 215" dur="20s" repeatCount="indefinite" />
      </circle>
      <circle cx="855" cy="130" r="5" fill="#D97706">
        <animateTransform attributeName="transform" type="rotate" from="0 855 215" to="360 855 215" dur="10s" repeatCount="indefinite" />
      </circle>
      <text x="855" y="205" text-anchor="middle" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Hackathons</text>
      <text x="855" y="226" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="700" fill="#D97706">SIH 2025, 2026</text>
      <text x="855" y="244" text-anchor="middle" class="font-mono" font-size="10.5" fill="#64748B">Blind Coding 1st</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6.8s" begin="-4.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>

  <!-- 6. AWS Cloud Intern -->
  <g transform="translate(0, 0)">
    <g>
      <circle cx="995" cy="130" r="62" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5" filter="url(#lightShadow)" />
      <circle cx="995" cy="130" r="68" fill="none" stroke="#F97316" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360 995 130" to="0 995 130" dur="14s" repeatCount="indefinite" />
      </circle>
      <circle cx="995" cy="62" r="4.5" fill="#EA580C">
        <animateTransform attributeName="transform" type="rotate" from="0 995 130" to="-360 995 130" dur="7s" repeatCount="indefinite" />
      </circle>
      <text x="995" y="122" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="800" fill="#0F172A">AWS Intern</text>
      <text x="995" y="141" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#EA580C">Cloud Arch</text>
      <text x="995" y="157" text-anchor="middle" class="font-mono" font-size="9.5" fill="#64748B">AICTE</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="7.4s" begin="-5.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
    </g>
  </g>
</svg>
