<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 262" width="500" height="262">
  <defs>
    <linearGradient id="cardBgL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <ellipse cx="250" cy="250" rx="160" ry="7" fill="#000" opacity="0.08">
    <animate attributeName="rx" values="160;130;160" dur="5.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.04;0.08" dur="5.1s" repeatCount="indefinite" />
  </ellipse>

  <g>
    <rect x="10" y="20" width="480" height="210" rx="20" fill="url(#cardBgL2)" stroke="#2563EB" stroke-width="2" />

    <rect x="36" y="44" width="88" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" />
    <circle cx="48" cy="55" r="4" fill="#2563EB">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="59" class="font-sans" font-size="11" font-weight="700" fill="#1D4ED8">LIVE APP</text>

    <text x="36" y="96" class="font-sans" font-size="25" font-weight="900" fill="#0F172A">Cyber-Arena</text>

    <text x="36" y="124" class="font-sans" font-size="13.5" fill="#475569">Interactive cybersecurity sandbox platform.</text>
    <text x="36" y="144" class="font-sans" font-size="13.5" fill="#475569">Hands-on exploits &amp; defensive modules.</text>

    <g transform="translate(36, 172)">
      <rect x="0" y="0" width="56" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="28" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#0284C7">React</text>

      <rect x="62" y="0" width="48" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="86" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#7C3AED">Vite</text>

      <rect x="116" y="0" width="76" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="154" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#059669">Supabase</text>

      <rect x="198" y="0" width="56" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="226" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#DC2626">Vercel</text>
    </g>

    <g transform="translate(385, 80)">
      <path d="M 0,-40 L 40,-25 V 10 C 40,36 18,54 0,66 C -18,54 -40,36 -40,10 V -25 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" />
      
      <text x="-16" y="14" class="font-mono" font-size="28" font-weight="800" fill="#2563EB">&gt;</text>
      <rect x="3" y="-3" width="12" height="4" rx="2" fill="#EF4444">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>

      <line x1="-32" y1="-20" x2="32" y2="-20" stroke="#EF4444" stroke-width="2" opacity="0.8">
        <animate attributeName="y1" values="-20;45;-20" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="y2" values="-20;45;-20" dur="2.8s" repeatCount="indefinite" />
      </line>
    </g>

    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="5.1s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
  </g>
