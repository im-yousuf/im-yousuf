<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 262" width="500" height="262">
  <defs>
    <linearGradient id="cardBgL3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <ellipse cx="250" cy="250" rx="160" ry="7" fill="#000" opacity="0.08">
    <animate attributeName="rx" values="160;130;160" dur="4.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.04;0.08" dur="4.4s" repeatCount="indefinite" />
  </ellipse>

  <g>
    <rect x="10" y="20" width="480" height="210" rx="20" fill="url(#cardBgL3)" stroke="#D97706" stroke-width="2" />

    <rect x="36" y="44" width="136" height="22" rx="11" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
    <circle cx="48" cy="55" r="4" fill="#D97706">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="59" class="font-sans" font-size="10.5" font-weight="700" fill="#B45309">SIH 2026 PROJECT</text>

    <text x="36" y="96" class="font-sans" font-size="25" font-weight="900" fill="#0F172A">MandiSetu</text>

    <text x="36" y="124" class="font-sans" font-size="13.5" fill="#475569">SMS-based mandi slot reservations with</text>
    <text x="36" y="144" class="font-sans" font-size="13.5" fill="#475569">weather-adaptive dynamic queueing.</text>

    <g transform="translate(36, 172)">
      <rect x="0" y="0" width="66" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="33" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#D97706">Next.js</text>

      <rect x="72" y="0" width="76" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="110" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#059669">Supabase</text>

      <rect x="154" y="0" width="56" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="182" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#DC2626">Twilio</text>

      <rect x="216" y="0" width="58" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="245" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#0284C7">Weather</text>
    </g>

    <g transform="translate(340, 45)">
      <path d="M 0 120 Q 60 20 120 120" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="3 6" />

      <circle cx="0" cy="120" r="8" fill="#F1F5F9" stroke="#D97706" stroke-width="2" />
      <circle cx="120" cy="120" r="8" fill="#F1F5F9" stroke="#2563EB" stroke-width="2">
        <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite" />
      </circle>

      <circle r="4" fill="#D97706">
        <animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M 0 120 Q 60 20 120 120" />
      </circle>
      <circle r="4" fill="#2563EB">
        <animateMotion dur="3.5s" begin="-1.2s" repeatCount="indefinite" path="M 0 120 Q 60 20 120 120" />
      </circle>
      <circle r="4" fill="#059669">
        <animateMotion dur="3.5s" begin="-2.4s" repeatCount="indefinite" path="M 0 120 Q 60 20 120 120" />
      </circle>
    </g>

    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="4.4s" begin="-0.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" />
  </g>
</svg>
