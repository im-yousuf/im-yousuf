<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="radarBeamLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-opacity="0.7" />
      <circle cx="40" cy="40" r="1" fill="#3B82F6" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes scanlineLight {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(370px); opacity: 0; }
    }
    .light-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      fill: url(#accentGradLight);
    }
    .mono-text {
      font-family: 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Base Card -->
  <rect x="4" y="4" width="992" height="352" rx="24" fill="url(#bgGradLight)" stroke="#CBD5E1" stroke-width="2" />
  <rect x="4" y="4" width="992" height="352" rx="24" fill="url(#lightGrid)" />

  <!-- Scanning Laser Line -->
  <line x1="20" y1="0" x2="980" y2="0" stroke="url(#radarBeamLight)" stroke-width="2" style="animation: scanlineLight 8s linear infinite;" />

  <!-- Rotating Particle Ring (Right Side) -->
  <g transform="translate(810, 180)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
    </circle>

    <!-- Center Core -->
    <circle cx="0" cy="0" r="28" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5">
      <animate attributeName="r" values="26;30;26" dur="3s" repeatCount="indefinite" />
    </circle>
    <polygon points="0,-14 12,0 0,14 -12,0" fill="#2563EB" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </polygon>

    <!-- Orbiting Particles -->
    <g>
      <circle cx="110" cy="0" r="4.5" fill="#2563EB" />
      <circle cx="-110" cy="0" r="3.5" fill="#3B82F6" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </g>
    <g>
      <circle cx="0" cy="85" r="5" fill="#7C3AED" />
      <circle cx="0" cy="-85" r="3.5" fill="#A855F7" />
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
    </g>
    <g>
      <circle cx="42" cy="42" r="4" fill="#059669" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Left Side Header Content -->
  <!-- Status Badge Pill -->
  <g transform="translate(56, 52)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="19" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#1D4ED8" letter-spacing="1">SYSTEM: ACTIVE // 2026</text>
  </g>

  <!-- Main Name Title -->
  <text x="54" y="132" font-size="44" class="light-title">MOHAMMED YOUSUF UDDIN</text>

  <!-- Role Line -->
  <text x="56" y="172" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#1E293B" letter-spacing="0.5">
    Data Science Undergraduate <tspan fill="#2563EB">|</tspan> Machine Learning <tspan fill="#7C3AED">|</tspan> AI &amp; Cloud Architect
  </text>

  <!-- Mission Subtitle -->
  <text x="56" y="208" font-family="'Segoe UI', sans-serif" font-size="14.5" fill="#475569">
    Crafting scalable ML pipelines, Generative AI applications &amp; high-performance data systems.
  </text>

  <!-- HUD Telemetry Pills -->
  <g transform="translate(56, 246)">
    <g>
      <rect x="0" y="0" width="186" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="14" y="21" class="mono-text" font-size="11.5" font-weight="700" fill="#1D4ED8">🎓 B.Tech CSE (DS)</text>
    </g>
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="198" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="14" y="21" class="mono-text" font-size="11.5" font-weight="700" fill="#047857">🚀 GfG Ambassador</text>
    </g>
    <g transform="translate(404, 0)">
      <rect x="0" y="0" width="184" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="14" y="21" class="mono-text" font-size="11.5" font-weight="700" fill="#6D28D9">🏆 Blind Coding Win</text>
    </g>
    <g transform="translate(598, 0)">
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="14" y="21" class="mono-text" font-size="11.5" font-weight="700" fill="#B45309">☁️ AWS Certified</text>
    </g>
  </g>

  <!-- Coordinates -->
  <text x="56" y="324" class="mono-text" font-size="11" fill="#64748B">LAT: 17.3850° N, LON: 78.4867° E [HYDERABAD, IN]</text>
  <text x="944" y="324" text-anchor="end" class="mono-text" font-size="11" fill="#64748B">STATUS: 100% OPERATIONAL // REPO: IM-YOUSUF</text>
</svg>
