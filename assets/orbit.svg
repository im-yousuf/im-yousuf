<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1224" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Container Shell -->
  <rect x="4" y="4" width="892" height="472" rx="28" fill="url(#orbitBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Stars & Grid Dust -->
  <circle cx="150" cy="90" r="1.5" fill="#38BDF8" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" /></circle>
  <circle cx="780" cy="110" r="1.5" fill="#A855F7" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" /></circle>
  <circle cx="120" cy="390" r="2" fill="#34D399" opacity="0.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite" /></circle>
  <circle cx="760" cy="380" r="1.5" fill="#FBBF24" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" /></circle>

  <!-- Central Nebula Cloud -->
  <circle cx="450" cy="240" r="140" fill="#7000FF" opacity="0.08" filter="url(#coreGlow)" />
  <circle cx="450" cy="240" r="80" fill="#00F0FF" opacity="0.08" filter="url(#coreGlow)" />

  <!-- Orbit Track 1: Inner (r=105) -->
  <circle cx="450" cy="240" r="105" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.45" />

  <!-- Orbit Track 2: Middle (r=160) -->
  <circle cx="450" cy="240" r="160" fill="none" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="6 10" opacity="0.4" />

  <!-- Orbit Track 3: Outer (r=215) -->
  <circle cx="450" cy="240" r="215" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.35" />

  <!-- ================= INNER ORBIT RING (rotates clockwise 24s) ================= -->
  <g>
    <!-- Item 1: Python (0 deg) -->
    <g transform="rotate(0 450 240)">
      <g transform="translate(555 240)">
        <g transform="rotate(0)">
          <rect x="-38" y="-13" width="76" height="26" rx="13" fill="#0f172a" stroke="#00F0FF" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#00F0FF">Python</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 2: FastAPI (90 deg) -->
    <g transform="rotate(90 450 240)">
      <g transform="translate(555 240)">
        <g transform="rotate(-90)">
          <rect x="-38" y="-13" width="76" height="26" rx="13" fill="#0f172a" stroke="#059669" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#10B981">FastAPI</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 3: Java (180 deg) -->
    <g transform="rotate(180 450 240)">
      <g transform="translate(555 240)">
        <g transform="rotate(-180)">
          <rect x="-32" y="-13" width="64" height="26" rx="13" fill="#0f172a" stroke="#F97316" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#FB923C">Java</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 4: PostgreSQL (270 deg) -->
    <g transform="rotate(270 450 240)">
      <g transform="translate(555 240)">
        <g transform="rotate(-270)">
          <rect x="-44" y="-13" width="88" height="26" rx="13" fill="#0f172a" stroke="#3B82F6" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#60A5FA">Postgres</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite" />
        </g>
      </g>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 240" to="360 450 240" dur="24s" repeatCount="indefinite" />
  </g>

  <!-- ================= MIDDLE ORBIT RING (rotates counter-clockwise 38s) ================= -->
  <g>
    <!-- Item 1: Scikit-Learn (0 deg) -->
    <g transform="rotate(0 450 240)">
      <g transform="translate(610 240)">
        <g transform="rotate(0)">
          <rect x="-45" y="-13" width="90" height="26" rx="13" fill="#0f172a" stroke="#F59E0B" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#FBBF24">Scikit-Learn</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 2: LangChain (72 deg) -->
    <g transform="rotate(72 450 240)">
      <g transform="translate(610 240)">
        <g transform="rotate(-72)">
          <rect x="-44" y="-13" width="88" height="26" rx="13" fill="#0f172a" stroke="#10B981" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#34D399">LangChain</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 3: Pinecone (144 deg) -->
    <g transform="rotate(144 450 240)">
      <g transform="translate(610 240)">
        <g transform="rotate(-144)">
          <rect x="-42" y="-13" width="84" height="26" rx="13" fill="#0f172a" stroke="#A855F7" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#C084FC">Pinecone</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 4: Docker (216 deg) -->
    <g transform="rotate(216 450 240)">
      <g transform="translate(610 240)">
        <g transform="rotate(-216)">
          <rect x="-36" y="-13" width="72" height="26" rx="13" fill="#0f172a" stroke="#0284C7" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#38BDF8">Docker</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 5: Git / GitHub (288 deg) -->
    <g transform="rotate(288 450 240)">
      <g transform="translate(610 240)">
        <g transform="rotate(-288)">
          <rect x="-32" y="-13" width="64" height="26" rx="13" fill="#0f172a" stroke="#EF4444" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#F87171">Git</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite" />
        </g>
      </g>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="360 450 240" to="0 450 240" dur="38s" repeatCount="indefinite" />
  </g>

  <!-- ================= OUTER ORBIT RING (rotates clockwise 54s) ================= -->
  <g>
    <!-- Item 1: AWS (0 deg) -->
    <g transform="rotate(0 450 240)">
      <g transform="translate(665 240)">
        <g transform="rotate(0)">
          <rect x="-35" y="-13" width="70" height="26" rx="13" fill="#0f172a" stroke="#FF9900" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#FF9900">AWS</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="54s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 2: Power BI (60 deg) -->
    <g transform="rotate(60 450 240)">
      <g transform="translate(665 240)">
        <g transform="rotate(-60)">
          <rect x="-42" y="-13" width="84" height="26" rx="13" fill="#0f172a" stroke="#FACC15" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#FACC15">Power BI</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="54s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 3: Tableau (120 deg) -->
    <g transform="rotate(120 450 240)">
      <g transform="translate(665 240)">
        <g transform="rotate(-120)">
          <rect x="-40" y="-13" width="80" height="26" rx="13" fill="#0f172a" stroke="#E11D48" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#FB7185">Tableau</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="54s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 4: Supabase (180 deg) -->
    <g transform="rotate(180 450 240)">
      <g transform="translate(665 240)">
        <g transform="rotate(-180)">
          <rect x="-44" y="-13" width="88" height="26" rx="13" fill="#0f172a" stroke="#10B981" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="11.5" fill="#34D399">Supabase</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="54s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 5: React (240 deg) -->
    <g transform="rotate(240 450 240)">
      <g transform="translate(665 240)">
        <g transform="rotate(-240)">
          <rect x="-35" y="-13" width="70" height="26" rx="13" fill="#0f172a" stroke="#00F0FF" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#38BDF8">React</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="54s" repeatCount="indefinite" />
        </g>
      </g>
    </g>

    <!-- Item 6: Next.js (300 deg) -->
    <g transform="rotate(300 450 240)">
      <g transform="translate(665 240)">
        <g transform="rotate(-300)">
          <rect x="-38" y="-13" width="76" height="26" rx="13" fill="#0f172a" stroke="#E2E8F0" stroke-width="1.8" filter="url(#badgeGlow)" />
          <text y="4.5" text-anchor="middle" class="font-sans" font-size="12" fill="#FFFFFF">Next.js</text>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="54s" repeatCount="indefinite" />
        </g>
      </g>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 240" to="360 450 240" dur="54s" repeatCount="indefinite" />
  </g>

  <!-- ================= PULSING CENTRAL CORE ================= -->
  <g transform="translate(450, 240)">
    <circle cx="0" cy="0" r="42" fill="#090d1a" stroke="#00F0FF" stroke-width="3" filter="url(#coreGlow)">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#7000FF" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </circle>
    <text y="-5" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1">TECH</text>
    <text y="12" text-anchor="middle" class="font-sans" font-size="12" font-weight="900" fill="#00F0FF" letter-spacing="1">REACTOR</text>
  </g>
</svg>