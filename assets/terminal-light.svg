  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    @keyframes blinkL { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes lineFade1L { 0%, 5% { opacity: 0; } 12%, 100% { opacity: 1; } }
    @keyframes lineFade2L { 0%, 15% { opacity: 0; } 22%, 100% { opacity: 1; } }
    @keyframes lineFade3L { 0%, 25% { opacity: 0; } 32%, 100% { opacity: 1; } }
    @keyframes lineFade4L { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
    @keyframes lineFade5L { 0%, 45% { opacity: 0; } 52%, 100% { opacity: 1; } }
    @keyframes lineFade6L { 0%, 55% { opacity: 0; } 62%, 100% { opacity: 1; } }
    .cursorL { animation: blinkL 1s step-end infinite; }
  </style>

  <!-- Shell -->
  <rect x="4" y="4" width="992" height="382" rx="16" fill="url(#termBgLight)" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Header Bar -->
